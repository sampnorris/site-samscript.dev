<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#f0efed"/>
  <rect x="0" y="0" width="1200" height="630" fill="#111111"/>
  <!-- Emerald accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="#0D7C66"/>
  <!-- Brand dot -->
  <circle cx="80" cy="80" r="6" fill="#0D7C66"/>
  <!-- Brand name -->
  <text x="100" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#666666" text-transform="uppercase">SAMSCRIPT AGENCY</text>
  <!-- Main headline -->
  <text x="80" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="500" fill="#f0efed" letter-spacing="-2">AI Automation</text>
  <text x="80" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="500" fill="#f0efed" letter-spacing="-2">for Small Business</text>
  <!-- Subline -->
  <text x="80" y="440" font-family="Georgia, serif" font-size="20" fill="#666666">We automate the work your team shouldn't be doing.</text>
  <!-- Domain -->
  <text x="80" y="570" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#0D7C66">SAMSCRIPT.DEV</text>
  <!-- Bottom accent line -->
  <rect x="0" y="620" width="1200" height="10" fill="#0D7C66"/>
</svg>
