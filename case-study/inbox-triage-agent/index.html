<p><small>01 &middot; Trade Services &middot; Inbox Triage Agent</small></p>
<h1>Losing Jobs From the Bottom of an Inbox</h1>
<p><em>A busy trades business with 20+ unread emails by mid-morning. The owner triaged everything after 7pm, tired, often replying to three-day-old quote requests only to find the customer had already gone elsewhere.</em></p>
<h2>The Situation</h2>
<p>A well-regarded local trades business — busy, word-of-mouth driven, fully booked most weeks. The owner had been in the industry for years and ran a tight operation on the tools. Off the tools, though, was a different story.</p>
<p>By mid-morning on any given day, the inbox already had 20+ unread messages. Quote requests. Customers chasing job updates. A supplier confirming a delivery. A complaint. Spam. All of it in one inbox, unsorted, in the order it arrived.</p>
<p>The owner would get to it in the evening — after a full day on site, usually past 7pm — working through it tired, often missing things, sometimes responding to a three-day-old quote request and wondering why the customer had already gone elsewhere.</p>
<h2>What We Built</h2>
<p>The Inbox Triage Agent — a single agent sitting silently inside the existing email setup. No new software. No change to how customers contact the business. Every email classified on arrival: New Enquiry, Existing Customer, Supplier/Admin, or Low Priority. New enquiries get an immediate, personalised reply in the owner's voice.</p>
<h2>Results</h2>
<table border="1" cellpadding="8" cellspacing="0" style="border-collapse:collapse;width:100%;">
<tr><th>Metric</th><th>Before</th><th>After</th></tr>
<tr><td>First response</td><td>18–36 hrs</td><td><strong>Under 4 min</strong></td></tr>
<tr><td>Missed enquiries</td><td>4–6/mo</td><td><strong>~0</strong></td></tr>
<tr><td>Inbox triage time</td><td>45–60 min/day</td><td><strong>&lt;10 min/day</strong></td></tr>
<tr><td>Pipeline visibility</td><td>None</td><td><strong>Full, real-time</strong></td></tr>
</table>
<blockquote><p>"I used to dread opening my emails at night. Now I get a message in the morning that tells me what I need to deal with. I look at it while I'm having a brew. Done."</p><p>— Owner, trade business</p></blockquote>
