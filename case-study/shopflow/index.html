<p><small>03 &middot; E-commerce / Shopify &middot; ShopFlow</small></p>
<h1>Sitting on a Revenue Problem It Didn't Know It Had</h1>
<p><em>A two-person Shopify store doing decent volume. Nobody had looked at what the data was saying: abandoned carts recovering at under 2%, founders spending 90 minutes a day on repeat support questions, and 60% of customers lapsed with zero win-back.</em></p>
<h2>The Situation</h2>
<p>A two-person Shopify store doing decent volume, not struggling, not flying. The founders were across everything: sourcing, fulfilment, marketing, customer emails.</p>
<p>The store had been running for three years and had a growing customer base. Repeat purchases were happening, but inconsistently.</p>
<p>Nobody had sat down and looked at what the data was actually saying.</p>
<h2>What We Built</h2>
<p>Three connected automations on one Shopify store. Smart abandoned cart sequences, three-touch, AI-written per cart value and customer history, never generic. An AI support agent trained on their catalogue, policies, and live order data.</p>
<h2>Results</h2>
<table border="1" cellpadding="8" cellspacing="0" style="border-collapse:collapse;width:100%;">
<tr><th>Metric</th><th>Before</th><th>After</th></tr>
<tr><td>Cart recovery</td><td>~2%</td><td><strong>11%</strong></td></tr>
<tr><td>Daily support time</td><td>~90 min</td><td><strong>~15 min</strong></td></tr>
<tr><td>Win-back revenue (10wk)</td><td>£0</td><td><strong>£2,200</strong></td></tr>
<tr><td>Support response</td><td>4–8 hrs</td><td><strong>&lt;90 seconds</strong></td></tr>
</table>
<blockquote><p>"Turns out abandoned carts were costing us more than our ad spend. Fixing it felt obvious in hindsight, but we just didn't have the time."</p><p>— Co-founder, Shopify store</p></blockquote>
