<p><small>02 &middot; Independent Retail &middot; Social Presence Agent</small></p>
<h1>Invisible on Its Own Social Media</h1>
<p><em>A small brand with thousands of engaged followers, but the owner managed everything alone. Comments got replies days late. DMs sat unread for a week. Buying signals went cold. The algorithm noticed — reach had been declining for months.</em></p>
<h2>The Situation</h2>
<p>A small independent brand with a genuinely engaged following — built over years through good product, good photography, and a personality people liked.</p>
<p>On the surface it looked like strong social presence. Beneath it, the owner was managing everything alone — product, fulfilment, customer service, marketing.</p>
<p>Comments were getting a reply every few days, if at all. DMs sat unread for a week. Questions one answer away from a sale were going cold. The algorithm noticed.</p>
<h2>What We Built</h2>
<p>The Social Presence Agent — monitoring Instagram and Facebook comments and DMs in real time. Every comment classified: Purchase Intent, General Enquiry, Compliment, Complaint, or Spam. Buying questions get an instant, on-brand reply.</p>
<h2>Results</h2>
<table border="1" cellpadding="8" cellspacing="0" style="border-collapse:collapse;width:100%;">
<tr><th>Metric</th><th>Before</th><th>After</th></tr>
<tr><td>Comment reply time</td><td>3–4 days</td><td><strong>Under 8 min</strong></td></tr>
<tr><td>Reply rate</td><td>~35%</td><td><strong>97%</strong></td></tr>
<tr><td>DM response rate</td><td>~40%</td><td><strong>94%</strong></td></tr>
<tr><td>Organic reach</td><td>Declining</td><td><strong>Up 34%</strong></td></tr>
</table>
<blockquote><p>"I used to feel guilty every time I opened Instagram. Now it's just… handled. I check in when I want to, not because I have to."</p><p>— Owner, independent brand</p></blockquote>
